<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LHWS PRICE APP - 01.01.2026</title>
  <meta name="theme-color" content="#161c4c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LHWS Price">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon-192.png" alt="" width="40" height="40">
    <h1 id="title">LHWS PRICE APP - 01.01.2026</h1>
  </header>

  <form id="price-form" novalidate>
    <div id="pickers"></div>
    <div id="numbers"></div>
    <hr class="divider">
    <section class="card results" aria-label="Totals">
      <div class="result"><div><span class="r-label">RETAIL</span></div><output id="out-retail">$0.00</output></div>
      <div class="result"><div><span class="r-label">PAR (8% commissionable)</span><span class="sub">*Includes $500 admin fee</span></div><output id="out-par">$500.00</output></div>
      <div class="result"><div><span class="r-label">COST</span><span class="sub">*Account for CC/Finance fees</span></div><output id="out-cost">$0.00</output></div>
    </section>
    <div class="actions">
      <button type="submit" id="submit-btn" class="submit">CLEAR FORM</button>
      <p class="hint">Emails this quote, then clears the form.</p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>
  </form>

  <div class="totals-bar" aria-hidden="true">
    <div><span>RETAIL</span><b id="bar-retail">$0.00</b></div>
    <div><span>PAR</span><b id="bar-par">$500.00</b></div>
    <div><span>COST</span><b id="bar-cost">$0.00</b></div>
  </div>

  <script src="form-data.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
